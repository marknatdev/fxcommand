[project]
name = "fxcommand"
version = "0.1.0"
description = "Autonomous multi-symbol MT5 trading engine with dashboard API"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "mcp>=2.2",
    "httpx>=0.27",
]

[project.scripts]
fxcommand = "fxcommand.main:run"
fxcommand-mcp = "fxcommand.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fxcommand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["mt5: read-only smoke tests against the real MT5 terminal (opt-in: -m mt5)"]
addopts = "-m 'not mt5'"
