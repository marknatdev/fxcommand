[project]
name = "vibedesk"
version = "0.1.0"
description = "Vibe Desk: an AI research desk that turns trading ideas into honest verdicts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.61",
    "numpy>=2.0",
    "pydantic>=2.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (known answers, Trial benchmarks) run at checkpoints: uv run pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "perf: performance benchmark",
    "slow: excluded from the default run; run with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vibedesk"]
known-local-folder = ["reference_engine"]
