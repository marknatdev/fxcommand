[project]
name = "vibedesk"
version = "0.1.0"
description = "Vibe Desk: an AI research desk that turns trading ideas into honest verdicts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.61",
    "numpy>=2.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# The live MT5 terminal, for the read-only `desk` commands; tests never need it.
mt5 = [
    "metatrader5>=5.0.6231 ; sys_platform == 'win32'",
]

[project.scripts]
desk = "vibedesk.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (known answers, Trial benchmarks) run at checkpoints: uv run pytest -m slow
# Four workers, one per physical core of the dev laptop: eight (one per logical core) ran slower
# and pushed the timing tests over their budgets. -n 0 runs everything in one process.
addopts = "-m 'not slow' -n 4 --dist loadfile"
markers = [
    "perf: performance benchmark",
    "slow: excluded from the default run; run with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vibedesk"]
known-local-folder = ["reference_engine"]
